name: Test, Build, and Deploy | Module 01 - Lab2.2 Senior Project

on:
  push:
    branches: [main]

jobs: 
  test-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps: 
      - uses: actions/checkout@v4
      
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      
      - run: npm i
      - run: npm run build

  deploy:
      needs: test-build
      runs-on: ubuntu-latest

      strategy:
        matrix:
          node-version: [16.x]

      steps:
        - name: Deploy to server
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            password: ${{ secrets.PASSWORD }}
            port: ${{ secrets.PORT }}
            script: |
              eval "$(ssh-agent -s)"
              ssh-add ~/.ssh/ssh-praktikan86
              echo "Check project folder";
              [ ! -d "${HOME}/senpro/533008/modul02/senpro-github-actions/" ] && 
              {
                echo "Repository has not been cloned. Cloning now...";
                mkdir -p ~/senpro/533008/modul02;
                cd ~/senpro/533008/modul02;
                git clone https://github.com/amarelyy/senpro-github-action.git
                cd ~/senpro/533008/modul02/senpro-github-actions;
                echo "Install Packages and Build Project";
                npm install;
                npm run build;
              } || {
                echo "Repository already exists. Building...";
                cd ~/senpro/533008/modul02/senpro-github-actions;
                git restore .;
                git pull origin main;
                echo "Install Packages and Build Project";
                npm install;
                npm run build;
              }